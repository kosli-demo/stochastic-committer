# DEMO part 2: reset the environment back to compliant.
#
# Snapshots the fake "staging" environment with the whole fleet using every
# repo's REAL (already-attested) artifact file and no rogue artifact, so the
# artifact previously shown with no provenance is gone and the environment goes
# back to green.
#
# This is the cheap, targeted reset: it re-harvests the fleet's files and
# snapshots, with no repo_count/repo_chance commit+CI fan-out. scope is
# hard-wired to prod (same environment as demo-deploy-rogue.yml).

name: Demo - reset environment to compliant

on:
  workflow_dispatch: {}

jobs:
  reset-to-green:
    uses: ./.github/workflows/demo-snapshot.yml
    with:
      scope: prod
      repo_count: '200'
      # Empty string = no rogue artifact -- snapshot only the real, attested fleet.
      rogue_artifact: ''
    secrets:
      KOSLI_API_TOKEN_STAGING: ${{ secrets.KOSLI_API_TOKEN_STAGING }}
      KOSLI_API_TOKEN_PROD: ${{ secrets.KOSLI_API_TOKEN_PROD }}

# DEMO part 1: deploy a single no-provenance artifact to staging-k8s.
#
# Reads the current staging-k8s snapshot and re-reports it PLUS one extra
# artifact named "rogue-trader" whose digest was never attested to any flow, so
# the environment goes non-compliant. Run demo-reset-to-green.yml to remove it.
#
# Because the steady-state snapshot reconciles the readback (copying unchanged
# artifacts verbatim), the rogue PERSISTS across normal cron runs -- the env
# stays non-compliant until you reset. Reset is therefore mandatory, not optional.
#
# Targets app.kosli.com (the host the cron reports staging-k8s to).

name: ▶️ Demo - deploy no-provenance artifact

on:
  workflow_dispatch: {}

env:
  KOSLI_ORG: ${{ vars.KOSLI_ORG }}
  KOSLI_API_TOKEN_PROD: ${{ secrets.KOSLI_API_TOKEN_PROD }}

jobs:
  deploy-rogue:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Deploy rogue-trader to staging-k8s
        run: |
          set -Eeuo pipefail
          HOST="https://app.kosli.com"
          ENVN="staging-k8s"

          # Read the current snapshot (400/404 -> empty, i.e. bootstrap).
          code="$(curl --silent --show-error --retry 5 --retry-max-time 120 \
            --output current.json --write-out '%{http_code}' \
            --header "Authorization: Bearer ${KOSLI_API_TOKEN_PROD}" \
            "${HOST}/api/v2/snapshots/${KOSLI_ORG}/${ENVN}/-1")"
          if [ "${code}" = "200" ]; then
            : # use current.json as read back
          elif [ "${code}" = "400" ] || [ "${code}" = "404" ]; then
            echo '{"artifacts":[]}' > current.json
          else
            echo "GET snapshot failed: ${code}" ; cat current.json ; exit 1
          fi

          # A rogue artifact: a valid-looking digest that was never attested to
          # any flow, so Kosli finds no provenance for it -> non-compliant.
          jq -n --arg ts "$(date +%s)" '[{
            repo_name: "rogue-trader",
            image_ref: "ghcr.io/kosli-demo/rogue-trader:rogue",
            digest: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef",
            creation_timestamp: ($ts | tonumber),
            namespace: "beta",
            pod_name: "rogue-trader-6f7a8b9c0-z1x2c",
            owners: [{apiVersion: "apps/v1", kind: "ReplicaSet", name: "rogue-trader-6f7a8b9c0", uid: "3d0e2f4a-5b6c-7d8e-9f0a-1b2c3d4e5f60", controller: true, blockOwnerDeletion: true}]
          }]' > rogue.json

          python3 bin/k8s_build_snapshot.py --current current.json --fresh rogue.json > report.json

          curl --fail --silent --show-error --retry 5 --retry-max-time 120 \
            --request PUT \
            --header "Authorization: Bearer ${KOSLI_API_TOKEN_PROD}" \
            --header "Content-Type: application/json" \
            --data @report.json \
            "${HOST}/api/v2/environments/${KOSLI_ORG}/${ENVN}/report/K8S"
          echo "deployed rogue-trader to ${ENVN} on ${HOST}"

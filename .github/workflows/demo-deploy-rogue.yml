# DEMO part 1: deploy a single artifact with no provenance.
#
# Snapshots the fake "staging" environment with the whole fleet plus ONE extra
# artifact (default rogue-trader) that has no provenance, so the environment goes
# non-compliant. The extra artifact need not be a real repo. Run
# demo-reset-to-green.yml afterwards to remove it and restore compliance.
#
# NOTE: scope is hard-wired to prod, so this snapshots the fake "staging"
# environment on https://app.kosli.com -- the same one the 6-hourly main-cronjob
# writes. Kosli snapshots are immutable numbered history, so the cron does NOT
# erase your rogue snapshot; it only appends later (green) snapshots. The current
# view may therefore flip back to green -- navigate to your rogue snapshot to show
# it, or pause the schedule in main-cronjob.yml for a clean live view.

name: Demo - deploy no-provenance artifact

on:
  workflow_dispatch:
    inputs:
      rogue_artifact:
        description: 'Name of the no-provenance artifact to deploy (need not be a real repo)'
        type: string
        required: false
        default: rogue-trader

jobs:
  deploy-rogue:
    uses: ./.github/workflows/demo-snapshot.yml
    with:
      scope: prod
      repo_count: '200'
      rogue_artifact: ${{ inputs.rogue_artifact }}
    secrets:
      KOSLI_API_TOKEN_STAGING: ${{ secrets.KOSLI_API_TOKEN_STAGING }}
      KOSLI_API_TOKEN_PROD: ${{ secrets.KOSLI_API_TOKEN_PROD }}

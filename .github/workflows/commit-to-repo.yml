name: Commit to repo

on:
  workflow_call:
    inputs:
      repo_name:
        type: string
        required: true
    secrets:
      CLONE_PUSH_REPOS:
        required: true

jobs:
  commit-to-repo:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ inputs.repo_name }}
      GH_TOKEN: ${{ secrets.CLONE_PUSH_REPOS }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.event.sender.login }}@users.noreply.github.com"

      - name: Commit to repo
        run: |
          gh repo clone "kosli-demo/${REPO_NAME}"
          mv "${REPO_NAME}"/.git /tmp
          gh repo clone kosli-demo/base
          cd base
          rm -rf .git
          mv /tmp/.git .
          TIMESTAMP="$(date +%s)"
          echo "${REPO_NAME} ${TIMESTAMP}" > ./source/datetime.txt

          # Pick a random commit message and author so the demo git history -- and the
          # resulting Kosli provenance -- look like real team activity rather than one
          # bot repeating "Simulated commit". Fetched from raw.githubusercontent, a CDN
          # with no per-token rate limit, the same way all-repos.json is fetched.
          raw="https://raw.githubusercontent.com/kosli-demo/stochastic-committer/refs/heads/main/data"
          curl --fail --retry 5 --retry-max-time 120 --silent --show-error --output /tmp/commit-messages.json "${raw}/commit-messages.json"
          curl --fail --retry 5 --retry-max-time 120 --silent --show-error --output /tmp/authors.json "${raw}/authors.json"
          MESSAGE="$(jq --raw-output '.[]' /tmp/commit-messages.json | shuf --head-count=1)"
          AUTHOR="$(jq --compact-output '.[]' /tmp/authors.json | shuf --head-count=1)"
          AUTHOR_NAME="$(jq --raw-output '.name' <<< "${AUTHOR}")"
          AUTHOR_EMAIL="$(jq --raw-output '.email' <<< "${AUTHOR}")"

          git add .
          export GIT_AUTHOR_NAME="${AUTHOR_NAME}"
          export GIT_AUTHOR_EMAIL="${AUTHOR_EMAIL}"
          export GIT_COMMITTER_NAME="${AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${AUTHOR_EMAIL}"
          git commit --message "${MESSAGE}"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/kosli-demo/${REPO_NAME}.git"
          git push --set-upstream origin main

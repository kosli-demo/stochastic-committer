# Both matrix jobs are designed to avoid hitting GitHub's 256-job matrix limit:
#
# create-new-repos fans out only over repos that do not yet exist on GitHub.
# On most runs all repos are already present, so the matrix is empty and the
# job is skipped entirely.
#
# simulate-commits-to-selected-repos fans out only over repos that were randomly
# selected for a commit this run (typically a small fraction of N). Fanning out
# over all N repos regardless of selection would waste jobs and, with a large
# enough N, could hit the limit.

name: Simulate commits on many repos

on:
  workflow_call:
    inputs:
      scope:
        description: 'Where to attest to'
        type: string
        required: false
        default: prod
      repo_count:
        description: 'Number of demo repos to select'
        type: number
        required: false
        default: 200
      repo_chance:
        description: '% chance each repo will get a commit+push'
        type: number
        required: false
        default: 5
    secrets:
      CLONE_PUSH_REPOS:
        required: true
      KOSLI_API_TOKEN_STAGING:
        required: true
      KOSLI_API_TOKEN_PROD:
        required: true

  workflow_dispatch:
    inputs:
      scope:
        description: 'Where to attest to'
        type: choice
        required: true
        options:
          - prod
          - staging
          - both
      repo_count:
        description: 'Number of demo repos to select'
        required: false
        default: 200
      repo_chance:
        description: '% chance each repo will get a commit+push'
        required: false
        default: 5

env:
  KOSLI_ORG: ${{ vars.KOSLI_ORG }}
  KOSLI_DEBUG: ${{ vars.KOSLI_DEBUG }}
  KOSLI_DRY_RUN: ${{ vars.KOSLI_DRY_RUN }}
  REPO_COUNT: ${{ inputs.repo_count }}
  REPO_CHANCE: ${{ inputs.repo_chance }}


jobs:
  select-n-repos:
    needs: []
    runs-on: ubuntu-latest
    outputs:
      selected_repos: ${{ steps.set-repos.outputs.selected_repos }}
      non_existent_repos: ${{ steps.set-repos.outputs.non_existent_repos }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Select repo names
        id: set-repos
        env:
          GH_TOKEN: ${{ secrets.CLONE_PUSH_REPOS }}
        run: |
          URL=https://raw.githubusercontent.com/kosli-demo/base/refs/heads/main/data/all-repos.json
          curl --fail --retry 5 --retry-max-time 120 --output all_repos.json --show-error --silent "${URL}"
          ./bin/select_repos.py all_repos.json ${REPO_COUNT} ${REPO_CHANCE} > n_repos.json
          SELECTED_REPOS="$(jq --compact-output '[.[] | select(.selected == true)]' n_repos.json)"

          # non-existent repos (exists == false) are the ones create-new-repos must
          # create this run. select_repos.py force-selects them, so they are also in
          # SELECTED_REPOS and get committed + CI'd (attested) once created -- which is
          # how a newly-added repo enters the environment the same run.
          NON_EXISTENT_REPOS="$(jq --compact-output '[.[] | select(.exists == false)]' n_repos.json)"
          
          echo "selected_repos=${SELECTED_REPOS}" >> ${GITHUB_OUTPUT}
          echo "non_existent_repos=${NON_EXISTENT_REPOS}" >> ${GITHUB_OUTPUT}


  create-new-repos:
    needs: [select-n-repos]
    if: ${{ needs.select-n-repos.outputs.non_existent_repos != '[]' }}
    strategy:
      # Limit concurrency to avoid hitting GitHub API secondary rate limits
      # when a large jump in repo_count causes many repos to be created at once.
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.select-n-repos.outputs.non_existent_repos) }}
    uses: ./.github/workflows/create-new-repo.yml
    with:
      repo_name: ${{ matrix.repo_name }}
    secrets:
      CLONE_PUSH_REPOS: ${{ secrets.CLONE_PUSH_REPOS }}


  # mark-new-repos-as-existing keeps the exists field in all-repos.json accurate
  # by flipping exists to true for any repo that was just created. This caching
  # avoids two problems that arose when select_repos.py checked existence via the
  # GitHub API on every run: (1) rate limiting at high repo counts, and (2) ~100s
  # of sequential HTTPS calls to check 500 repos one by one.
  mark-new-repos-as-existing:
    needs: [select-n-repos, create-new-repos]
    if: ${{ !failure() && !cancelled() && needs.select-n-repos.outputs.non_existent_repos != '[]' }}
    runs-on: ubuntu-latest
    env:
      NON_EXISTENT_REPOS: ${{ needs.select-n-repos.outputs.non_existent_repos }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Configure git
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.event.sender.login }}@users.noreply.github.com"

      - uses: actions/checkout@v6
        with:
          repository: kosli-demo/base
          token: ${{ secrets.CLONE_PUSH_REPOS }}

      - name: Mark newly created repos as existing in all-repos.json
        run: |
          echo "${NON_EXISTENT_REPOS}" | jq --raw-output '.[].repo_name' | while read -r REPO_NAME; do
            jq --arg name "${REPO_NAME}" \
              '(.[] | select(.repo_name == $name) | .exists) |= true' \
              data/all-repos.json > tmp.json
            mv tmp.json data/all-repos.json
          done

      - name: Commit and push
        run: |
          git add data/all-repos.json
          if git diff --cached --quiet; then
            echo "No newly created repos to mark; working tree clean, nothing to commit."
          else
            git commit --message "Mark newly created repos as existing"
            git push
          fi


  simulate-commits-to-selected-repos:
    needs: [select-n-repos, create-new-repos, mark-new-repos-as-existing]
    # !failure() && !cancelled() is required because create-new-repos is skipped when all
    # repos already exist. GitHub would otherwise propagate that skip to this job, preventing
    # commits even when repos are selected. This condition lets the job run as long as nothing
    # has actually failed or been cancelled.
    if: ${{ !failure() && !cancelled() && needs.select-n-repos.outputs.selected_repos != '[]' }}
    strategy:
      # fail-fast: false so one repo's failing commit/trigger leg does not cancel the sibling
      # matrix legs. Each selected repo commits + triggers its CI independently; a failure in
      # one leaves the others free to finish and attest their own provenance. Without this,
      # the default fail-fast: true would cancel every in-flight leg on the first failure.
      fail-fast: false
      # max-parallel caps how many legs run at once. Each leg is short -- one `gh workflow run`
      # POST, then exit -- so at 20 concurrent legs the dispatch rate stays well inside GitHub's
      # secondary rate limits (20 concurrent requests vs a 100 ceiling; the resulting POST rate
      # vs the 900-points/min and 80-content-requests/min ceilings). With legs this short,
      # max-parallel is the main lever bounding that rate, so raising it needs care.
      max-parallel: 20
      matrix:
        include: ${{ fromJSON(needs.select-n-repos.outputs.selected_repos) }}
    uses: ./.github/workflows/commit-to-repo-and-trigger-ci.yml
    with:
      scope: ${{ inputs.scope }}
      repo_name: ${{ matrix.repo_name }}
      # Lets trigger-ci skip the workflow-availability poll for repos that already exist
      # (only newly-created repos need it), cutting GitHub API calls per leg.
      exists: ${{ matrix.exists }}
    secrets:
      CLONE_PUSH_REPOS: ${{ secrets.CLONE_PUSH_REPOS }}
      KOSLI_API_TOKEN_STAGING: ${{ secrets.KOSLI_API_TOKEN_STAGING }}
      KOSLI_API_TOKEN_PROD: ${{ secrets.KOSLI_API_TOKEN_PROD }}


  # Waits for every selected repo's dispatched CI to finish before the snapshot runs, so
  # the snapshot never reads a flow attestation that has not landed yet.
  # Each selected repo committed a new datetime.txt (changing its image) and dispatched its
  # main.yml CI, which attests the real image digest to the repo's Kosli flow.
  #
  # Polls with ONE batched GraphQL query covering the whole selected fleet. GraphQL bills
  # against a 5000-points/hour budget that is separate from the REST 5000-requests/hour primary
  # limit, and the whole fleet costs ~1 point per poll, so this wait's cost is independent of
  # fleet size and of REST usage elsewhere in the run.
  await-selected-repos-ci:
    needs: [select-n-repos, simulate-commits-to-selected-repos]
    # Mirror the snapshot's gating: run whenever repos were selected and selection itself
    # succeeded, even if some commit/trigger legs failed (honest partial -- a repo whose CI
    # never ran shows up as non-compliant in the snapshot rather than silently vanishing).
    if: ${{ always() && needs.select-n-repos.result == 'success' && needs.select-n-repos.outputs.selected_repos != '[]' }}
    runs-on: ubuntu-latest
    env:
      SELECTED_REPOS: ${{ needs.select-n-repos.outputs.selected_repos }}
      GH_TOKEN: ${{ secrets.CLONE_PUSH_REPOS }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - name: Wait for all triggered CI runs to complete
        # Each selected repo received exactly one commit this run and its main.yml does not
        # push back to main, so main's HEAD is the commit whose workflow_dispatch CI run we
        # are waiting on. A commit with no Actions workflow_dispatch check suite yet counts
        # as PENDING (never as done), so we fail toward "not complete" -- we never let the
        # snapshot proceed on an unproven attestation.
        run: |
          mapfile -t REPOS < <(jq --raw-output '.[].repo_name' <<< "${SELECTED_REPOS}")

          # One aliased repository field per repo (r0, r1, ...); GraphQL aliases must be
          # bare identifiers, so we index them and map back to REPOS[i] when reporting.
          build_query() {
            printf 'fragment ci on Repository { object(expression:"main") { ... on Commit {'
            printf ' checkSuites(first:20, filterBy:{appId:15368}) { nodes {'
            printf ' status conclusion workflowRun { event } } } } } }\n'
            printf '{\n'
            local i=0
            for repo in "${REPOS[@]}"; do
              printf '  r%s: repository(owner:"kosli-demo", name:"%s") { ...ci }\n' "${i}" "${repo}"
              i=$((i + 1))
            done
            printf '  rateLimit { cost remaining }\n}\n'
          }
          QUERY="$(build_query)"

          DEADLINE=$(( $(date +%s) + 1800 ))   # 30 minute ceiling

          # Reduce each repo's Actions workflow_dispatch check suites to one state: PENDING
          # if none exist yet or any is not COMPLETED, SUCCESS if all completed successfully,
          # else FAILURE. `// []` keeps a missing repo/branch as PENDING rather than erroring.
          reduce='
            .data | to_entries | map(select(.key | startswith("r")))
            | map({ (.key): ((.value.object.checkSuites.nodes // [])
                | map(select(.workflowRun.event == "workflow_dispatch"))
                | if length == 0 then "PENDING"
                  elif any(.status != "COMPLETED") then "PENDING"
                  elif all(.conclusion == "SUCCESS") then "SUCCESS"
                  else "FAILURE" end) })
            | add'

          while true; do
            # gh exits non-zero (and names the alias on stderr) if any repo cannot be
            # resolved yet -- e.g. a just-created repo still replicating into GraphQL -- but
            # it STILL returns partial data for the repos that did resolve. Tolerate the exit
            # and drop stderr: an unresolved repo reads as null -> PENDING below (keep
            # waiting), the safe direction, and one laggard never hides its siblings' states.
            RESULT="$(gh api graphql --field query="${QUERY}" 2>/dev/null || true)"
            # An empty/garbage response (total network failure) reduces to {}, so every repo
            # defaults to PENDING and we simply poll again until the deadline.
            STATES_JSON="$(jq --compact-output "${reduce}" <<< "${RESULT}" 2>/dev/null || echo '{}')"

            pending=""
            failed=""
            for i in "${!REPOS[@]}"; do
              state="$(jq --raw-output --arg k "r${i}" '.[$k] // "PENDING"' <<< "${STATES_JSON}")"
              case "${state}" in
                PENDING) pending="${pending} ${REPOS[$i]}" ;;
                FAILURE) failed="${failed} ${REPOS[$i]}" ;;
              esac
            done

            if [ -z "${pending}" ]; then
              break
            fi
            echo "Waiting on:${pending}"
            if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
              echo "Timed out after 30 minutes still waiting on:${pending}"
              exit 1
            fi
            sleep 20
          done

          # Every run has reached a terminal state. Fail if any CI did not succeed. The
          # snapshot needs this job yet runs under always(), so it still reports the true
          # environment even when this job fails.
          if [ -n "${failed}" ]; then
            echo "CI did not succeed for:${failed}"
            exit 1
          fi
          echo "All ${#REPOS[@]} selected repos' CI runs succeeded"

  simulate-deployments-from-selected-repos:
    needs: [select-n-repos, simulate-commits-to-selected-repos, await-selected-repos-ci]
    # `needs` keeps the ordering edge: this job waits for every commit/CI leg to
    # finish before snapshotting, so it never reports a repo before the CI run that
    # attests its real image digest has completed. The `if` only relaxes the
    # *success* requirement:
    #
    #   - always() lets the snapshot run even when some commit legs failed. Combined
    #     with fail-fast: false above, a partial failure leaves the whole snapshot
    #     intact -- the repos whose CI succeeded still get their matching provenance,
    #     and any that failed show up honestly as non-compliant in the environment.
    #
    #   - gating on select-n-repos success avoids snapshotting nothing: if repo
    #     selection itself failed there is no fleet to report.
    #
    # The K8S snapshot logic lives in the reusable snapshot-k8s.yml.
    if: ${{ always() && needs.select-n-repos.result == 'success' }}
    uses: ./.github/workflows/snapshot-k8s.yml
    with:
      scope: ${{ inputs.scope }}
      selected_repos: ${{ needs.select-n-repos.outputs.selected_repos }}
    secrets:
      KOSLI_API_TOKEN_STAGING: ${{ secrets.KOSLI_API_TOKEN_STAGING }}
      KOSLI_API_TOKEN_PROD: ${{ secrets.KOSLI_API_TOKEN_PROD }}
